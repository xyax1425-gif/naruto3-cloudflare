<!doctype html>
<!-- Netlify publish refresh: 2026-11-03 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17130f">
  <title>NARUTO - ダブルアップ抽選</title>
  <style>
    :root { color-scheme:dark; --gold:#ffd64f; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; min-height:100svh; padding:30px 20px;
      display:flex; align-items:center; justify-content:center;
      font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      color:#fff;
      background:
        radial-gradient(ellipse at 50% 36%,#71351f 0%,#3c211b 43%,transparent 76%),
        linear-gradient(145deg,#171522 0%,#0c0b14 100%);
    }
    .wrap { width:100%; max-width:630px; }
    .card {
      width:100%; padding:48px 38px 38px;
      border:2px solid #e6c65f; border-radius:43px;
      background:linear-gradient(155deg,#211d35 0%,#100f1e 70%,#090914 100%);
      box-shadow:0 0 40px #ed792b40,0 18px 55px #000b;
      text-align:center;
    }
    .eyebrow {
      margin:0 0 25px; color:#ffd64f;
      font-size:16px; font-weight:900; letter-spacing:4px;
    }
    h1 {
      margin:0; color:#fff; font-size:clamp(30px,7vw,42px);
      line-height:1.35; letter-spacing:0; white-space:nowrap;
    }
    .sub {
      margin:18px 0 38px; color:#d4d0df;
      font-size:clamp(15px,3.8vw,20px); white-space:nowrap;
    }
    .trial-orb {
      width:clamp(220px,39vw,270px); height:clamp(220px,39vw,270px);
      margin:0 auto 32px; display:grid; place-items:center;
      border:4px solid #8e8a9a; border-radius:50%;
      background:radial-gradient(circle at 50% 43%,#ffcf25 0%,#ff8a12 35%,#a6380b 63%,#211322 78%);
      color:#fff; font-size:clamp(24px,5vw,34px); font-weight:900;
      text-shadow:0 2px 5px #632000;
      box-shadow:0 0 0 5px #ffb52b22,0 0 26px #ff9b25,0 0 62px #ff8b1c99,inset 0 0 25px #ffdd4d99;
    }
    .chance { margin:0 0 34px; color:#ddd5df; font-size:17px; white-space:nowrap; }
    .instructions { margin:0 0 12px; text-align:left; color:#f5edf2; font-size:17px; font-weight:800; }
    input {
      display:block; width:100%; height:94px; padding:0 18px;
      border:3px solid #f0d45c; border-radius:20px;
      background:#fff; color:#29232b; font-size:clamp(24px,5vw,32px);
      letter-spacing:.08em; text-align:center; box-shadow:none;
    }
    input::placeholder { color:#aaa8aa; }
    input:focus { outline:none; border-color:#ffe77c; box-shadow:0 0 0 4px #ffd34b33,0 0 22px #ffae2c66; }
    button {
      display:flex; align-items:center; justify-content:center;
      width:100%; min-height:96px; margin:24px auto 0; padding:18px 12px;
      border:0; border-radius:999px;
      background:linear-gradient(100deg,#ffd52e 0%,#ffad24 48%,#f36b18 100%);
      color:#241322; font-family:inherit; font-size:clamp(20px,4.8vw,29px);
      font-weight:950; letter-spacing:0; white-space:nowrap; word-break:keep-all;
      text-shadow:0 1px 0 #fff5;
      box-shadow:0 9px 0 #8d3d16,0 15px 34px #ff7b2866;
      animation:buttonGlow 1.8s ease-in-out infinite alternate;
      cursor:pointer;
    }
    button:active:not(:disabled) { transform:translateY(5px); box-shadow:0 4px 0 #8d3d16,0 8px 20px #ff7b2844; }
    button:disabled { opacity:.7; animation:none; cursor:wait; }
    @keyframes buttonGlow {
      from { filter:brightness(1); box-shadow:0 9px 0 #8d3d16,0 0 18px #ff9b2c88,0 15px 34px #ff7b2844; }
      to { filter:brightness(1.14); box-shadow:0 9px 0 #8d3d16,0 0 30px #ffd45aaa,0 15px 42px #ff7b2877; }
    }
    .note { margin:34px 0 0; color:#bdb7c8; font-size:14px; line-height:1.9; text-align:center; }
    #result { display:none; margin-top:20px; padding:20px 14px; border:1px solid #e6c65f; border-radius:18px; background:#100f1e; }
    #result.show { display:block; animation:pop .45s ease-out; }
    #resultTitle { margin:0 0 9px; color:#ffd65a; font-size:25px; font-weight:900; }
    #resultText { margin:0; color:#f8e8d5; line-height:1.7; }
    .burst { display:none; color:#ffcf6a; font-size:28px; letter-spacing:.2em; margin:10px 0; }
    .burst.on { display:block; animation:flash .55s infinite alternate; }
    @keyframes pop { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:scale(1); } }
    @keyframes flash { from { opacity:.35; transform:scale(.9); } to { opacity:1; transform:scale(1.08); } }
    footer { display:none; }
    @media (max-width:480px) {
      body { padding:30px 20px; }
      .card { padding:28px 22px 25px; border-radius:25px; }
      .eyebrow { margin:0 0 17px; font-size:16px; letter-spacing:4px; }
      h1 { font-size:clamp(25px,7vw,30px); }
      .sub { margin:12px 0 22px; font-size:13px; line-height:1.6; }
      .trial-orb {
        width:136px; height:136px; margin:0 auto 17px;
        border-width:2px; font-size:19px;
        box-shadow:0 0 0 3px #ffb52b22,0 0 17px #ff9b25,0 0 36px #ff8b1c99,inset 0 0 15px #ffdd4d99;
      }
      .chance { margin:0 0 20px; font-size:12px; }
      .instructions { margin:0 0 9px; font-size:13px; }
      input { height:60px; padding:0 12px; border-width:2px; border-radius:12px; font-size:20px; }
      button { min-height:56px; height:56px; margin:14px auto 0; padding:0 8px; font-size:17px; }
      .note { margin:24px 0 0; font-size:11px; line-height:1.8; }
      #result { margin-top:17px; padding:16px 12px; }
    }
    @media (max-width:360px) {
      .card { padding-left:17px; padding-right:17px; }
      .eyebrow { font-size:13px; letter-spacing:3px; }
      h1 { font-size:25px; }
      .sub { font-size:12px; }
      .chance { font-size:11px; }
      button { font-size:15px; }
    }
    @media (prefers-reduced-motion:reduce) { button,.burst.on { animation:none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">NINJA DOUBLE CHANCE</p>
      <h1>忍の運命をつかめ！</h1>
      <p class="sub">くじ券の番号を入力して、チャクラを解放！</p>
      <div class="trial-orb" aria-hidden="true">火影の試練</div>
      <p class="chance">当選確率 15% ／ チャンスは1回だけ！</p>
      <p class="instructions">くじ券の番号</p>
      <input id="ticketNumber" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="番号を入力" aria-label="抽選番号">
      <button id="draw" type="button">運命の抽選をする！</button>
      <div class="burst" id="burst" aria-hidden="true">★　★　★</div>
      <section id="result" aria-live="polite">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
      </section>
      <p class="note">番号1つにつき抽選は1回限りです。使用済みの番号は、別のスマホからも再使用できません。</p>
    </section>
    <footer>© DOUBLE UP CHANCE</footer>
  </main>
  <script>
    const button = document.getElementById("draw");
    const result = document.getElementById("result");
    const title = document.getElementById("resultTitle");
    const message = document.getElementById("resultText");
    const ticketNumber = document.getElementById("ticketNumber");
    const burst = document.getElementById("burst");

    button.addEventListener("click", async () => {
      const number = ticketNumber.value.trim();
      if (!/^\d{1,20}$/.test(number)) {
        alert("抽選番号を4桁の数字で入力してください！");
        ticketNumber.focus();
        return;
      }
      button.disabled = true;
      ticketNumber.disabled = true;
      button.textContent = "抽選中…";
      burst.classList.add("on");
      try {
        const response = await fetch("/api/draw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "抽選できませんでした");
        title.textContent = data.win ? "大当たり！景品GET！" : "今回ははずれ…";
        message.textContent = data.win
          ? "おめでとうございます！景品をお受け取りください！"
          : "参加ありがとう！またの挑戦をお待ちしています。";
        result.classList.add("show");
        button.textContent = "抽選終了";
      } catch (error) {
        alert(error.message);
        button.disabled = false;
        ticketNumber.disabled = false;
        button.textContent = "運命の抽選をする！";
      } finally {
        burst.classList.remove("on");
      }
    });
  </script>
</body>
</html>
